openapi: 3.0.3
info:
  title: Savio API
  description: |
    Personal Cashflow Intelligence & Financial Decision Support Platform.

    ## Authentication
    Cookie-based. `POST /auth/login` sets HttpOnly cookies (`access_token`,
    `refresh_token`). No credentials are ever stored in localStorage.

    ## CSRF
    Every state-changing request (`POST`, `PATCH`, `PUT`, `DELETE`) requires the
    `X-CSRF-Token` header. Bootstrap the token via `GET /auth/csrf`. In Swagger
    UI "Try it out", paste the token into the X-CSRF-Token parameter field.

    ## Money
    Monetary values are decimal-safe strings (e.g. `"1500000.00"`) unless a
    schema explicitly marks an integer minor-units field.

    ## Authority
    The Finance Engine calculates. AI interprets. AI output is never
    authoritative for financial state.
  version: 1.0.0

servers:
  - url: /api/v1

security:
  - cookieAuth: []

tags:
  - name: Auth
  - name: Settings
  - name: Sessions
  - name: Workspaces
  - name: Accounts
  - name: Categories
  - name: Transactions
  - name: Transfers
  - name: Recurring
  - name: Budgets
  - name: Goals
  - name: Analytics
  - name: Dashboard
  - name: Forecast
  - name: Scenarios
  - name: AI
  - name: Telegram
  - name: Audit
  - name: Infrastructure

paths:
  # ─────────────────────────────── AUTH ────────────────────────────────

  /auth/csrf:
    get:
      tags: [Auth]
      summary: Bootstrap CSRF token
      description: Sets the CSRF cookie and returns the token to send as `X-CSRF-Token`. Unauthenticated.
      security: []
      responses:
        '200':
          description: CSRF token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      csrf_token: { type: string }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates the user and their default personal workspace (OWNER). Rate limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '201': { $ref: '#/components/responses/AuthSuccess' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Sets access and refresh HttpOnly cookies on success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token
      description: |
        Rotates the refresh token (single use) and issues a new access token.
        Replay of a rotated token revokes the whole session family.
      security: []
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out current session
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Log out from all sessions
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { $ref: '#/components/schemas/UUID' }
                          name: { type: string }
                          email: { type: string, format: email }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── SETTINGS ──────────────────────────────

  /settings:
    get:
      tags: [Settings]
      summary: Get user settings
      responses:
        '200': { $ref: '#/components/responses/UserSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Settings]
      summary: Update user settings
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone: { type: string, example: Asia/Jakarta }
                ai_insights_enabled: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/UserSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────────── SESSIONS ──────────────────────────────

  /sessions:
    get:
      tags: [Sessions]
      summary: List active sessions
      responses:
        '200':
          description: Sessions of the current user, current one flagged
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Sessions]
      summary: Revoke all other sessions
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      description: Revokes every session except the current one.
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sessions/{id}:
    delete:
      tags: [Sessions]
      summary: Revoke one session
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '204': { description: Session revoked }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── WORKSPACES ──────────────────────────────

  /workspaces/current:
    get:
      tags: [Workspaces]
      summary: Active workspace of the current user
      responses:
        '200': { $ref: '#/components/responses/WorkspaceDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workspaces/current/members:
    get:
      tags: [Workspaces]
      summary: List workspace members
      responses:
        '200': { $ref: '#/components/responses/MemberList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Workspaces]
      summary: Invite/add a member
      description: OWNER only.
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [MEMBER, VIEWER] }
      responses:
        '201': { $ref: '#/components/responses/MemberDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /workspaces/current/members/{memberId}:
    patch:
      tags: [Workspaces]
      summary: Change member role
      description: OWNER only. The last OWNER cannot be demoted.
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [OWNER, MEMBER, VIEWER] }
      responses:
        '200': { $ref: '#/components/responses/MemberDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Workspaces]
      summary: Remove a member
      description: OWNER only. The last OWNER cannot be removed.
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '204': { description: Member removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── ACCOUNTS ──────────────────────────────

  /accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, ARCHIVED] } }
        - { name: type, in: query, schema: { type: string, enum: [CASH, BANK, EWALLET, SAVINGS] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, type, opening_balance, created_at] } }
        - { $ref: '#/components/parameters/Order' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CollectionEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Accounts]
      summary: Create account
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Account' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /accounts/{id}:
    get:
      tags: [Accounts]
      summary: Get account
      parameters: [{ $ref: '#/components/parameters/PathUUID' }]
      responses:
        '200': { $ref: '#/components/responses/AccountDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Accounts]
      summary: Update account
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { type: string, enum: [CASH, BANK, EWALLET, SAVINGS] }
                institution_name: { type: string }
                description: { type: string }
                version: { type: integer, description: Enables optimistic locking }
      responses:
        '200': { $ref: '#/components/responses/AccountDetail' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Accounts]
      summary: Delete account
      description: Allowed only when the account has no financial history; otherwise archive.
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '409':
          description: ACCOUNT_HAS_FINANCIAL_HISTORY — archive instead
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /accounts/{id}/archive:
    post:
      tags: [Accounts]
      summary: Archive account
      description: Accounts with history must be archived, not deleted. Archived accounts reject new activity.
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/AccountDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/{id}/restore:
    post:
      tags: [Accounts]
      summary: Restore archived account
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/AccountDetail' }

  /accounts/{id}/reconcile:
    post:
      tags: [Accounts]
      summary: Reconcile balance
      description: |
        Creates a signed ADJUSTMENT transaction so tracked balance matches
        `actual_balance`. Never rewrites history. Returns 409 when already aligned.
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actual_balance]
              properties:
                actual_balance: { $ref: '#/components/schemas/MoneyString' }
                reason: { type: string }
      responses:
        '200':
          description: Adjustment recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          adjustment: { $ref: '#/components/schemas/Transaction' }
                          difference: { $ref: '#/components/schemas/MoneyString' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ──────────────────────────── CATEGORIES ─────────────────────────────

  /categories:
    get:
      tags: [Categories]
      summary: List categories
      description: Returns system + workspace custom categories.
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [INCOME, EXPENSE] } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, ARCHIVED] } }
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Categories]
      summary: Create custom category
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string, enum: [INCOME, EXPENSE] }
      responses:
        '201': { $ref: '#/components/responses/CategoryDetail' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /categories/{id}:
    patch:
      tags: [Categories]
      summary: Update custom category
      description: System categories cannot be modified.
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '200': { $ref: '#/components/responses/CategoryDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /categories/{id}/archive:
    post:
      tags: [Categories]
      summary: Archive category
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/CategoryDetail' }

  /categories/{id}/restore:
    post:
      tags: [Categories]
      summary: Restore archived category
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/CategoryDetail' }

  # ─────────────────────────── TRANSACTIONS ────────────────────────────

  /transactions:
    get:
      tags: [Transactions]
      summary: List transactions
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [INCOME, EXPENSE, ADJUSTMENT] } }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, POSTED, VOIDED] } }
        - { name: account_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
        - { name: category_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, schema: { type: string }, description: Matches description }
        - { name: sort, in: query, schema: { type: string, enum: [transaction_date, amount, created_at] } }
        - { $ref: '#/components/parameters/Order' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated transactions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CollectionEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Transactions]
      summary: Create transaction
      description: |
        Creates an INCOME, EXPENSE or ADJUSTMENT transaction. Category type must
        match transaction type. New transactions start as DRAFT unless posted.
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCreate' }
      responses:
        '201': { $ref: '#/components/responses/TransactionDetail' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transactions/{id}:
    get:
      tags: [Transactions]
      summary: Get transaction
      parameters: [{ $ref: '#/components/parameters/PathUUID' }]
      responses:
        '200': { $ref: '#/components/responses/TransactionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Transactions]
      summary: Update DRAFT transaction
      description: Only DRAFT transactions are editable; POSTED financial fields are immutable. Void and recreate instead.
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionUpdate' }
      responses:
        '200': { $ref: '#/components/responses/TransactionDetail' }
        '409': { $ref: '#/components/responses/BusinessConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transactions/{id}/post:
    post:
      tags: [Transactions]
      summary: Post a DRAFT transaction
      description: Posting gives the transaction financial effect (affects balances/analytics).
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/TransactionDetail' }
        '409': { $ref: '#/components/responses/BusinessConflict' }

  /transactions/{id}/void:
    post:
      tags: [Transactions]
      summary: Void a POSTED transaction
      description: Preserves the record but excludes it from analytics and derived balances. Cannot void twice.
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/TransactionDetail' }
        '409': { $ref: '#/components/responses/BusinessConflict' }

  # ───────────────────────────── TRANSFERS ─────────────────────────────

  /transfers:
    get:
      tags: [Transfers]
      summary: List transfers
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Paginated transfers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CollectionEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Transfer' }
    post:
      tags: [Transfers]
      summary: Create transfer
      description: |
        Moves money between two different active accounts in the same workspace.
        Atomic: both legs commit together. Transfers never count as income or
        expense and never change total portfolio value.
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_account_id, destination_account_id, amount]
              properties:
                source_account_id: { $ref: '#/components/schemas/UUID' }
                destination_account_id: { $ref: '#/components/schemas/UUID' }
                amount: { $ref: '#/components/schemas/MoneyString' }
                transaction_date: { type: string, format: date }
                description: { type: string }
      responses:
        '201': { $ref: '#/components/responses/TransferDetail' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transfers/{id}:
    get:
      tags: [Transfers]
      summary: Get transfer
      parameters: [{ $ref: '#/components/parameters/PathUUID' }]
      responses:
        '200': { $ref: '#/components/responses/TransferDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /transfers/{id}/void:
    post:
      tags: [Transfers]
      summary: Void transfer
      description: Atomically reverses both legs.
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/TransferDetail' }
        '409': { $ref: '#/components/responses/BusinessConflict' }

  # ───────────────────────────── RECURRING ─────────────────────────────

  /recurring-transactions:
    get:
      tags: [Recurring]
      summary: List recurring rules
      responses:
        '200':
          description: Recurring rules
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CollectionEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RecurringRule' }
    post:
      tags: [Recurring]
      summary: Create recurring rule
      description: Planned financial activity. Occurrences start PENDING; auto-post is opt-in.
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, category_id, type, amount, frequency, start_date]
              properties:
                account_id: { $ref: '#/components/schemas/UUID' }
                category_id: { $ref: '#/components/schemas/UUID' }
                type: { type: string, enum: [INCOME, EXPENSE] }
                amount: { $ref: '#/components/schemas/MoneyString' }
                frequency: { type: string, enum: [DAILY, WEEKLY, MONTHLY, YEARLY] }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                auto_post: { type: boolean, default: false }
                description: { type: string }
      responses:
        '201': { $ref: '#/components/responses/RecurringDetail' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /recurring-transactions/{id}:
    get:
      tags: [Recurring]
      summary: Get recurring rule
      parameters: [{ $ref: '#/components/parameters/PathUUID' }]
      responses:
        '200': { $ref: '#/components/responses/RecurringDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Recurring]
      summary: Update recurring rule
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { $ref: '#/components/schemas/MoneyString' }
                frequency: { type: string, enum: [DAILY, WEEKLY, MONTHLY, YEARLY] }
                end_date: { type: string, format: date, nullable: true }
                description: { type: string }
      responses:
        '200': { $ref: '#/components/responses/RecurringDetail' }

  /recurring-transactions/{id}/pause:
    post:
      tags: [Recurring]
      summary: Pause rule
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/RecurringDetail' }

  /recurring-transactions/{id}/resume:
    post:
      tags: [Recurring]
      summary: Resume paused rule
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/RecurringDetail' }

  /recurring-transactions/{id}/end:
    post:
      tags: [Recurring]
      summary: End rule permanently
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/RecurringDetail' }

  /recurring-transactions/{id}/occurrences:
    get:
      tags: [Recurring]
      summary: List occurrences of a rule
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { name: status, in: query, schema: { type: string, enum: [PENDING, CONFIRMED, SKIPPED] } }
      responses:
        '200':
          description: Occurrences
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RecurrenceOccurrence' }

  /recurring-occurrences/{id}/confirm:
    post:
      tags: [Recurring]
      summary: Confirm occurrence as actual
      description: Creates the real transaction. Idempotent at most once per occurrence (DB unique constraint).
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/TransactionDetail' }
        '409': { $ref: '#/components/responses/BusinessConflict' }

  /recurring-occurrences/{id}/skip:
    post:
      tags: [Recurring]
      summary: Skip occurrence
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200':
          description: Occurrence skipped
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RecurrenceOccurrence' }

  # ────────────────────────────── BUDGETS ──────────────────────────────

  /budgets:
    get:
      tags: [Budgets]
      summary: List budgets
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, CLOSED] } }
        - { name: month, in: query, schema: { type: string, example: '2026-08' } }
      responses:
        '200':
          description: Budgets with computed utilization
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CollectionEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Budget' }
    post:
      tags: [Budgets]
      summary: Create budget
      description: Monthly expense-category budget. One active budget per category per period.
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, amount, period_start]
              properties:
                category_id: { $ref: '#/components/schemas/UUID' }
                amount: { $ref: '#/components/schemas/MoneyString' }
                period_start: { type: string, format: date, example: '2026-08-01' }
      responses:
        '201': { $ref: '#/components/responses/BudgetDetail' }
        '409': { $ref: '#/components/responses/DuplicateBudget' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /budgets/{id}:
    get:
      tags: [Budgets]
      summary: Get budget detail
      description: Includes actual spend derived from POSTED EXPENSE transactions only.
      parameters: [{ $ref: '#/components/parameters/PathUUID' }]
      responses:
        '200': { $ref: '#/components/responses/BudgetDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Budgets]
      summary: Update budget
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { $ref: '#/components/schemas/MoneyString' }
      responses:
        '200': { $ref: '#/components/responses/BudgetDetail' }

  /budgets/{id}/close:
    post:
      tags: [Budgets]
      summary: Close budget
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/BudgetDetail' }

  # ─────────────────────────────── GOALS ───────────────────────────────

  /goals:
    get:
      tags: [Goals]
      summary: List goals
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, PAUSED, ACHIEVED, CANCELLED] } }
      responses:
        '200':
          description: Goals with computed progress
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CollectionEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Goal' }
    post:
      tags: [Goals]
      summary: Create goal
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, target_amount, target_date]
              properties:
                name: { type: string }
                target_amount: { $ref: '#/components/schemas/MoneyString' }
                current_amount: { $ref: '#/components/schemas/MoneyString' }
                target_date: { type: string, format: date }
                priority: { type: string, enum: [LOW, MEDIUM, HIGH] }
                description: { type: string }
      responses:
        '201': { $ref: '#/components/responses/GoalDetail' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /goals/{id}:
    get:
      tags: [Goals]
      summary: Get goal detail
      description: Includes deterministic progress percentage, remaining amount, required monthly contribution.
      parameters: [{ $ref: '#/components/parameters/PathUUID' }]
      responses:
        '200': { $ref: '#/components/responses/GoalDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Goals]
      summary: Update goal
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                target_amount: { $ref: '#/components/schemas/MoneyString' }
                current_amount: { $ref: '#/components/schemas/MoneyString' }
                target_date: { type: string, format: date }
                priority: { type: string, enum: [LOW, MEDIUM, HIGH] }
                description: { type: string }
      responses:
        '200': { $ref: '#/components/responses/GoalDetail' }

  /goals/{id}/pause:
    post:
      tags: [Goals]
      summary: Pause goal
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/GoalDetail' }

  /goals/{id}/resume:
    post:
      tags: [Goals]
      summary: Resume paused goal
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/GoalDetail' }

  /goals/{id}/cancel:
    post:
      tags: [Goals]
      summary: Cancel goal
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/GoalDetail' }

  /goals/{id}/achieve:
    post:
      tags: [Goals]
      summary: Mark goal achieved
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/GoalDetail' }

  # ───────────────────────────── ANALYTICS ─────────────────────────────

  /analytics/cashflow:
    get:
      tags: [Analytics]
      summary: Cashflow summary
      description: POSTED INCOME/EXPENSE only. Excludes transfers, voided and adjustments.
      parameters:
        - { $ref: '#/components/parameters/FromRequired' }
        - { $ref: '#/components/parameters/ToRequired' }
      responses:
        '200': { $ref: '#/components/responses/CashflowSummary' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /analytics/categories:
    get:
      tags: [Analytics]
      summary: Category breakdown
      parameters:
        - { $ref: '#/components/parameters/FromRequired' }
        - { $ref: '#/components/parameters/ToRequired' }
      responses:
        '200':
          description: Totals grouped by category
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            category_id: { type: string }
                            category_name: { type: string }
                            total: { $ref: '#/components/schemas/MoneyString' }
                            items: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }

  /analytics/period-comparison:
    get:
      tags: [Analytics]
      summary: Compare two periods
      parameters:
        - { $ref: '#/components/parameters/FromRequired' }
        - { $ref: '#/components/parameters/ToRequired' }
        - { name: compare_from, in: query, required: true, schema: { type: string, format: date } }
        - { name: compare_to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Current vs previous cashflow with delta percentages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          current: { $ref: '#/components/schemas/Cashflow' }
                          previous: { $ref: '#/components/schemas/Cashflow' }
                          income_delta_percent: { type: string, nullable: true }
                          expense_delta_percent: { type: string, nullable: true }
        '422': { $ref: '#/components/responses/ValidationError' }

  /analytics/spending-changes:
    get:
      tags: [Analytics]
      summary: Per-category spending changes between periods
      parameters:
        - { $ref: '#/components/parameters/FromRequired' }
        - { $ref: '#/components/parameters/ToRequired' }
        - { name: compare_from, in: query, required: true, schema: { type: string, format: date } }
        - { name: compare_to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Categories where either period has spend
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            category_id: { type: string }
                            category_name: { type: string }
                            current: { $ref: '#/components/schemas/MoneyString' }
                            previous: { $ref: '#/components/schemas/MoneyString' }
                            delta: { $ref: '#/components/schemas/MoneyString' }
                            delta_percent: { type: string, nullable: true }
        '422': { $ref: '#/components/responses/ValidationError' }

  /analytics/recurring-expenses:
    get:
      tags: [Analytics]
      summary: Active recurring expense summary
      responses:
        '200':
          description: Rule count and estimated monthly total
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          active_rules: { type: integer }
                          estimated_monthly: { $ref: '#/components/schemas/MoneyString' }

  # ───────────────────────────── DASHBOARD ─────────────────────────────

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Composite dashboard payload
      description: |
        Total balance, accounts, current-month cashflow, upcoming scheduled
        occurrences (next 30 days, max 20) and recent ledger activity.
      responses:
        '200':
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total_balance: { type: integer, description: Minor units }
                          accounts:
                            type: array
                            items: { $ref: '#/components/schemas/Account' }
                          cashflow: { $ref: '#/components/schemas/Cashflow' }
                          upcoming:
                            type: array
                            items: { $ref: '#/components/schemas/RecurrenceOccurrence' }
                          recent:
                            type: array
                            items: { $ref: '#/components/schemas/Transaction' }

  # ───────────────────────────── FORECAST ──────────────────────────────

  /forecast:
    get:
      tags: [Forecast]
      summary: Deterministic cashflow forecast
      description: |
        Computed on demand from liquid balance, recurring rules (SCHEDULED),
        future-dated posted transactions (KNOWN) and trailing 90-day variable
        expense (ESTIMATED). Not persisted. No LLM involved.
      parameters:
        - { name: horizon, in: query, schema: { type: integer, enum: [30, 60, 90, 180, 365], default: 90 } }
      responses:
        '200':
          description: Forecast result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ForecastResult' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────────── SCENARIOS ─────────────────────────────

  /scenarios:
    get:
      tags: [Scenarios]
      summary: List scenarios
      responses:
        '200':
          description: Scenarios
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CollectionEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Scenario' }
    post:
      tags: [Scenarios]
      summary: Create scenario
      description: Non-destructive overlay over the baseline forecast. Real finance state is never mutated.
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '201': { $ref: '#/components/responses/ScenarioDetail' }

  /scenarios/{id}:
    get:
      tags: [Scenarios]
      summary: Get scenario
      parameters: [{ $ref: '#/components/parameters/PathUUID' }]
      responses:
        '200':
          description: Scenario with modifications and staleness flag
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Scenario' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Scenarios]
      summary: Update scenario metadata
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ScenarioDetail' }
    delete:
      tags: [Scenarios]
      summary: Delete scenario
      description: Deletes only scenario state; real finance records untouched.
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '204': { description: Deleted }

  /scenarios/{id}/modifications:
    post:
      tags: [Scenarios]
      summary: Add modification
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModificationInput' }
      responses:
        '201': { $ref: '#/components/responses/ScenarioDetail' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /scenarios/{id}/modifications/{modificationId}:
    patch:
      tags: [Scenarios]
      summary: Update modification
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { name: modificationId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModificationInput' }
      responses:
        '200': { $ref: '#/components/responses/ScenarioDetail' }
    delete:
      tags: [Scenarios]
      summary: Remove modification
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { name: modificationId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200': { $ref: '#/components/responses/ScenarioDetail' }

  /scenarios/{id}/calculate:
    post:
      tags: [Scenarios]
      summary: Calculate scenario projection
      description: Deterministic baseline forecast overlaid with modifications. Persists a snapshot.
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
        - { name: horizon, in: query, schema: { type: integer, enum: [30, 60, 90, 180, 365], default: 90 } }
      responses:
        '200':
          description: Baseline vs scenario comparison
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          baseline: { $ref: '#/components/schemas/ForecastResult' }
                          scenario: { $ref: '#/components/schemas/ForecastResult' }
                          is_stale: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }

  /scenarios/{id}/snapshots:
    get:
      tags: [Scenarios]
      summary: Get persisted baseline snapshot
      parameters: [{ $ref: '#/components/parameters/PathUUID' }]
      responses:
        '200':
          description: Frozen baseline at calculation time
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          baseline: { type: object, additionalProperties: true }
                          is_stale: { type: boolean }

  # ──────────────────────────────── AI ─────────────────────────────────

  /ai/status:
    get:
      tags: [AI]
      summary: AI availability status
      responses:
        '200':
          description: Whether AI features are enabled/configured
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          enabled: { type: boolean }

  /ai/categorize:
    post:
      tags: [AI]
      summary: Suggest category for a description
      description: Interpretive only; does not create or modify any transaction. Rate limited.
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string }
                merchant: { type: string }
      responses:
        '200':
          description: Suggested category with confidence
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          suggested_category:
                            type: object
                            properties:
                              id: { $ref: '#/components/schemas/UUID' }
                              name: { type: string }
                          confidence: { $ref: '#/components/schemas/MoneyString' }
                          reason: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AIUnavailable' }

  /ai/insight:
    post:
      tags: [AI]
      summary: Natural-language cashflow insight
      description: |
        Deterministic analytics facts are computed first; the LLM only explains
        them. `related_facts` carries the grounding figures. Rate limited
        (10/min per IP).
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                compare_from: { type: string, format: date }
                compare_to: { type: string, format: date }
      responses:
        '200':
          description: Insight grounded in deterministic facts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          headline: { type: string }
                          detail: { type: string }
                          signal: { type: string }
                          related_facts:
                            type: array
                            items: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AIUnavailable' }

  /ai/copilot:
    post:
      tags: [AI]
      summary: Ask the Savio Copilot
      description: Grounded finance Q&A through bounded domain tools. Authorization context injected by backend; never trusted from the model.
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string }
                horizon: { type: integer }
      responses:
        '200':
          description: Copilot answer with supporting facts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          answer: { type: string }
                          tool_calls:
                            type: array
                            items:
                              type: object
                              properties:
                                tool: { type: string }
                                arguments: { type: object }
                          related_facts:
                            type: array
                            items: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AIUnavailable' }

  /ai/conversations:
    get:
      tags: [AI]
      summary: List copilot conversations
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AIConversation' }
    post:
      tags: [AI]
      summary: Start copilot conversation
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
      responses:
        '201':
          description: Created conversation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AIConversation' }

  /ai/conversations/{id}:
    get:
      tags: [AI]
      summary: Get conversation with messages
      parameters: [{ $ref: '#/components/parameters/PathUUID' }]
      responses:
        '200':
          description: Conversation thread
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AIConversation' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [AI]
      summary: Delete conversation
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '204': { description: Deleted }

  /ai/conversations/{id}/messages:
    post:
      tags: [AI]
      summary: Send message to conversation
      parameters:
        - $ref: '#/components/parameters/PathUUID'
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '200':
          description: Assistant reply appended
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AIMessage' }
        '503': { $ref: '#/components/responses/AIUnavailable' }

  /ai/config:
    get:
      tags: [AI]
      summary: Get runtime AI configuration
      description: OWNER only. API key returned masked only.
      responses:
        '200':
          description: AI configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          enabled: { type: boolean }
                          provider: { type: string }
                          model: { type: string }
                          api_key_masked: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [AI]
      summary: Update runtime AI configuration
      description: OWNER only. Takes effect immediately without restart.
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                provider: { type: string }
                model: { type: string }
                api_key: { type: string, writeOnly: true }
      responses:
        '200':
          description: Updated configuration (key masked)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          enabled: { type: boolean }
                          provider: { type: string }
                          model: { type: string }
                          api_key_masked: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────────── TELEGRAM ──────────────────────────────

  /telegram/config:
    get:
      tags: [Telegram]
      summary: Get Telegram recap configuration
      description: OWNER only. Bot token masked.
      responses:
        '200':
          description: Telegram configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          enabled: { type: boolean }
                          bot_token_masked: { type: string }
                          chat_id: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Telegram]
      summary: Update Telegram recap configuration
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                bot_token: { type: string, writeOnly: true }
                chat_id: { type: string }
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }

  /telegram/config/register-webhook:
    post:
      tags: [Telegram]
      summary: Register Telegram webhook
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '200': { $ref: '#/components/responses/EmptySuccess' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────── AUDIT ────────────────────────────────

  /audit-logs:
    get:
      tags: [Audit]
      summary: Query audit logs
      description: OWNER only. Never contains secrets.
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { $ref: '#/components/schemas/UUID' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CollectionEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { $ref: '#/components/schemas/UUID' }
                            action: { type: string }
                            actor_id: { $ref: '#/components/schemas/UUID' }
                            entity_type: { type: string }
                            entity_id: { type: string }
                            created_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────── INFRASTRUCTURE ────────────────────────────

  /healthz:
    get:
      tags: [Infrastructure]
      summary: Liveness probe
      description: Served at `/health` (outside `/api/v1`). Fails only if the process is dead.
      security: []
      responses:
        '200': { description: Process alive }

  /readyz:
    get:
      tags: [Infrastructure]
      summary: Readiness probe
      description: Served at `/ready` (outside `/api/v1`). PostgreSQL critical; AI degradable.
      security: []
      responses:
        '200': { description: Ready }
        '503': { description: PostgreSQL unavailable }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: Required on all mutating requests. Obtain via GET /auth/csrf.
    PathUUID:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UUID' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }
    FromRequired:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    ToRequired:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }

  schemas:
    UUID:
      type: string
      format: uuid
    MoneyString:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: '1500000.00'
      description: Decimal-safe money string over minor units.

    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
    CollectionEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            meta:
              type: object
              properties:
                page: { type: integer }
                limit: { type: integer }
                total: { type: integer }
                total_pages: { type: integer }
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            details: { type: object, additionalProperties: { type: string } }
        message: { type: string }

    Session:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        device_name: { type: string }
        ip_address: { type: string }
        last_used_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        is_current: { type: boolean }

    Workspace:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        base_currency: { type: string, example: IDR }
        timezone: { type: string, example: Asia/Jakarta }
        my_role: { type: string, enum: [OWNER, MEMBER, VIEWER] }

    WorkspaceMember:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        user_id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [OWNER, MEMBER, VIEWER] }

    Account:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        type: { type: string, enum: [CASH, BANK, EWALLET, SAVINGS] }
        currency: { type: string }
        opening_balance: { type: integer, description: Minor units }
        derived_balance: { type: integer, description: Opening + posted ledger effects }
        institution_name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        version: { type: integer }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AccountCreate:
      type: object
      required: [name, type, currency]
      properties:
        name: { type: string }
        type: { type: string, enum: [CASH, BANK, EWALLET, SAVINGS] }
        currency: { type: string, description: Must match workspace base currency }
        opening_balance: { type: integer, minimum: 0, description: Minor units }
        institution_name: { type: string }
        description: { type: string }

    Category:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        type: { type: string, enum: [INCOME, EXPENSE] }
        is_system: { type: boolean }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }

    Transaction:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        account_id: { $ref: '#/components/schemas/UUID' }
        account_name: { type: string }
        category_id: { $ref: '#/components/schemas/UUID' }
        category_name: { type: string }
        type: { type: string, enum: [INCOME, EXPENSE, ADJUSTMENT] }
        amount: { $ref: '#/components/schemas/MoneyString' }
        transaction_date: { type: string, format: date }
        description: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, POSTED, VOIDED] }
        version: { type: integer }
        created_at: { type: string, format: date-time }

    TransactionCreate:
      type: object
      required: [account_id, category_id, type, amount, transaction_date]
      properties:
        account_id: { $ref: '#/components/schemas/UUID' }
        category_id: { $ref: '#/components/schemas/UUID', description: Type must match transaction type }
        type: { type: string, enum: [INCOME, EXPENSE, ADJUSTMENT] }
        amount: { $ref: '#/components/schemas/MoneyString' }
        transaction_date: { type: string, format: date }
        description: { type: string }
        status: { type: string, enum: [DRAFT, POSTED], default: DRAFT }

    TransactionUpdate:
      type: object
      description: DRAFT-only edit. Amount uses decimal-safe string.
      properties:
        amount: { $ref: '#/components/schemas/MoneyString' }
        transaction_date: { type: string, format: date }
        description: { type: string }
        category_id: { $ref: '#/components/schemas/UUID' }

    Transfer:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        source_account_id: { $ref: '#/components/schemas/UUID' }
        destination_account_id: { $ref: '#/components/schemas/UUID' }
        amount: { $ref: '#/components/schemas/MoneyString' }
        transaction_date: { type: string, format: date }
        description: { type: string, nullable: true }
        status: { type: string, enum: [POSTED, VOIDED] }

    RecurringRule:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        account_id: { $ref: '#/components/schemas/UUID' }
        category_id: { $ref: '#/components/schemas/UUID' }
        type: { type: string, enum: [INCOME, EXPENSE] }
        amount: { $ref: '#/components/schemas/MoneyString' }
        frequency: { type: string, enum: [DAILY, WEEKLY, MONTHLY, YEARLY] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        auto_post: { type: boolean }
        status: { type: string, enum: [ACTIVE, PAUSED, ENDED] }
        description: { type: string, nullable: true }

    RecurrenceOccurrence:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        recurring_id: { $ref: '#/components/schemas/UUID' }
        due_date: { type: string, format: date }
        type: { type: string, enum: [INCOME, EXPENSE] }
        amount: { $ref: '#/components/schemas/MoneyString' }
        account_name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, CONFIRMED, SKIPPED] }

    Budget:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        category_id: { $ref: '#/components/schemas/UUID' }
        category_name: { type: string }
        amount: { $ref: '#/components/schemas/MoneyString' }
        actual_spent: { $ref: '#/components/schemas/MoneyString', description: Derived from POSTED EXPENSE only }
        utilization_percent: { type: string }
        computed_status: { type: string, enum: [ON_TRACK, WARNING, EXCEEDED], description: Derived, not stored authority }
        period_start: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, CLOSED] }

    Goal:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        target_amount: { $ref: '#/components/schemas/MoneyString' }
        current_amount: { $ref: '#/components/schemas/MoneyString' }
        target_date: { type: string, format: date }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH] }
        status: { type: string, enum: [ACTIVE, PAUSED, ACHIEVED, CANCELLED] }
        progress_percent: { type: string, description: Deterministic }
        remaining_amount: { $ref: '#/components/schemas/MoneyString' }
        required_monthly_contribution: { $ref: '#/components/schemas/MoneyString', nullable: true }

    Cashflow:
      type: object
      properties:
        income: { $ref: '#/components/schemas/MoneyString' }
        expense: { $ref: '#/components/schemas/MoneyString' }
        net: { $ref: '#/components/schemas/MoneyString' }

    ForecastResult:
      type: object
      properties:
        opening_balance: { $ref: '#/components/schemas/MoneyString' }
        ending_balance: { $ref: '#/components/schemas/MoneyString' }
        minimum_balance: { $ref: '#/components/schemas/MoneyString' }
        minimum_balance_date: { type: string, format: date }
        projected_income: { $ref: '#/components/schemas/MoneyString' }
        projected_expense: { $ref: '#/components/schemas/MoneyString' }
        timeline:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              balance: { $ref: '#/components/schemas/MoneyString' }
        events:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              type: { type: string, enum: [KNOWN, SCHEDULED, ESTIMATED, ASSUMED] }
              kind: { type: string, enum: [INCOME, EXPENSE] }
              amount: { $ref: '#/components/schemas/MoneyString' }
              description: { type: string }
        confidence: { type: string, description: Deterministic metadata, never LLM-generated }
        assumptions:
          type: object
          properties:
            variable_expense_daily: { $ref: '#/components/schemas/MoneyString' }
            baseline_days: { type: integer }
            active_recurring_rules: { type: integer }
            confidence_basis: { type: string }
        calculation_version: { type: string }
        stale: { type: boolean }

    Scenario:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, CALCULATED] }
        is_stale: { type: boolean }
        last_calculated_at: { type: string, format: date-time, nullable: true }
        modifications:
          type: array
          items: { $ref: '#/components/schemas/ScenarioModification' }

    ScenarioModification:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        type:
          type: string
          enum: [ONE_TIME_EXPENSE, ONE_TIME_INCOME, RECURRING_EXPENSE, RECURRING_INCOME, INCOME_REDUCTION, INCOME_REMOVAL, EXPENSE_REDUCTION]
        amount: { $ref: '#/components/schemas/MoneyString', nullable: true }
        percent: { type: number, nullable: true }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        note: { type: string, nullable: true }

    ModificationInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [ONE_TIME_EXPENSE, ONE_TIME_INCOME, RECURRING_EXPENSE, RECURRING_INCOME, INCOME_REDUCTION, INCOME_REMOVAL, EXPENSE_REDUCTION]
        amount: { $ref: '#/components/schemas/MoneyString' }
        percent: { type: number }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        note: { type: string }

    AIConversation:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        title: { type: string }
        created_at: { type: string, format: date-time }
        messages:
          type: array
          items: { $ref: '#/components/schemas/AIMessage' }

    AIMessage:
      type: object
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }

  responses:
    AuthSuccess:
      description: Authenticated; auth cookies set
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { $ref: '#/components/schemas/UUID' }
                          name: { type: string }
                          email: { type: string, format: email }
    EmptySuccess:
      description: Success with empty payload
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { type: object }
    UserSettings:
      description: User settings
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      timezone: { type: string }
                      ai_insights_enabled: { type: boolean }
    WorkspaceDetail:
      description: Active workspace
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Workspace' }
    MemberList:
      description: Workspace members
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WorkspaceMember' }
    MemberDetail:
      description: Workspace member
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/WorkspaceMember' }
    AccountDetail:
      description: Account
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Account' }
    CategoryDetail:
      description: Category
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Category' }
    TransactionDetail:
      description: Transaction
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Transaction' }
    TransferDetail:
      description: Transfer
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Transfer' }
    RecurringDetail:
      description: Recurring rule
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/RecurringRule' }
    BudgetDetail:
      description: Budget with computed state
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Budget' }
    DuplicateBudget:
      description: BUDGET_DUPLICATE — one active budget per category per period
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    GoalDetail:
      description: Goal with computed progress
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Goal' }
    CashflowSummary:
      description: Cashflow totals
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    allOf:
                      - $ref: '#/components/schemas/Cashflow'
                      - type: object
                        properties:
                          savings_rate_percent: { type: string }
    ScenarioDetail:
      description: Scenario
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Scenario' }
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated but insufficient role (e.g. VIEWER mutation)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: RESOURCE_NOT_FOUND — cross-workspace IDs return 404, never foreign data
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Conflict (version conflict / duplicate)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BusinessConflict:
      description: Business rule conflict (invalid lifecycle transition)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Field validation failure with error.details mapping
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many requests
