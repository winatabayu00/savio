name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: savio
          POSTGRES_PASSWORD: savio
          POSTGRES_DB: savio
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U savio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://savio:savio@localhost:5433/savio?sslmode=disable
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      CSRF_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: migrate
        run: go run ./cmd/migrate -action=up
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      - name: race
        run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build