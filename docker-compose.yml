services:
  postgres:
    image: postgres:16-alpine
    container_name: savio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: savio
      POSTGRES_PASSWORD: savio
      POSTGRES_DB: savio
    ports:
      - "5433:5432"
    volumes:
      - savio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savio -d savio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: savio-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - savio_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: savio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: savio
      MINIO_ROOT_PASSWORD: saviosecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - savio_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: savio-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set savio http://minio:9000 savio saviosecret &&
      mc mb -p savio/savio-files || true &&
      mc anonymous set none savio/savio-files ||
      exit 0;
      "
    restart: "no"

volumes:
  savio_pgdata:
  savio_redisdata:
  savio_miniodata: